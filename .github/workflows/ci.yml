name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Descargar dependencias
        run: go mod download

      - name: Verificar formato (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Los siguientes archivos no están correctamente formateados:"
            echo "$UNFORMATTED"
            echo ""
            echo "Ejecuta 'gofmt -w .' para corregirlos."
            exit 1
          fi
          echo "✅ Formato de código verificado"

      - name: Verificar módulos (go vet)
        run: go vet ./...

      - name: Lint con golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m

      - name: Ejecutar tests con detección de race conditions
        run: go test ./... -v -race -coverprofile=coverage.out -covermode=atomic

      - name: Mostrar reporte de cobertura
        run: go tool cover -func=coverage.out

      - name: Verificar cobertura mínima del 68%
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 68)}"; then
            echo "❌ Cobertura insuficiente: ${COVERAGE}% (mínimo requerido: 68%)"
            exit 1
          fi
          echo "✅ Cobertura aceptable: ${COVERAGE}%"

      - name: Subir reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Compilar binario
        run: |
          go build -v \
            -ldflags="-X main.version=$(git describe --tags --always --dirty)" \
            -o bin/order-system \
            ./cmd/...
          echo "✅ Binario compilado exitosamente"

      - name: Verificar binario
        run: |
          ls -lh bin/order-system
          file bin/order-system

      - name: Guardar binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: order-system-linux-amd64
          path: bin/order-system
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Escanear vulnerabilidades
        run: govulncheck ./...
